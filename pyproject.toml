[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daas-engine"
version = "0.3.0"
description = "Source-Agnostic B2B Data-as-a-Service Engine (FastAPI + DuckDB + n8n)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PPC", email = "prochpc@gmail.com" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "duckdb>=0.10",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pandas>=2.1",
    "httpx>=0.26",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "markdown>=3.5",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: testy granic rozmiaru operujace na plikach rzedu 10 MiB",
    "performance: pomiar czasu ingestu; prog jest luzny i sygnalizuje regresje rzedu wielkosci, nie wahania maszyny",
]
