[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daas-engine"
version = "2.0.0"
description = "Source-Agnostic B2B Data-as-a-Service Engine (FastAPI + DuckDB + n8n)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PPC", email = "prochpc@gmail.com" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "duckdb>=0.10",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pandas>=2.1",
    "httpx>=0.26",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "markdown>=3.5",
    "openpyxl>=3.1",
    "defusedxml>=0.7.1",  # openpyxl wykrywa go i parsuje XLSX bezpiecznie (XXE, billion laughs)
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "mcp>=2.3,<3",  # serwer MCP (Streamable HTTP) pod /mcp: dostep agentow AI, docs/MCP.md
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]  # control plane na Postgresie: DAAS_CONTROL_DB_URL=postgresql+asyncpg://...
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.17.0",  # ta sama wersja co w CI; zależność wyłącznie developerska
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: testy granic rozmiaru operujace na plikach rzedu 10 MiB",
    "performance: pomiar czasu ingestu; prog jest luzny i sygnalizuje regresje rzedu wielkosci, nie wahania maszyny",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["runtime", "n8n", "docs"]

[tool.ruff.lint]
# E/F = bledy, B = bugbear, S = bezpieczenstwo (bandit), UP = nowoczesna skladnia, I = importy
select = ["E4", "E7", "E9", "F", "B", "S", "UP", "I"]
# styl, nie bledy: do posprzatania przy okazji, nie blokuje CI
ignore = ["UP031", "UP042"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "E741", "F811"]  # F811: wzorzec fixture pytest
"tools/**" = ["S603", "S607", "S310", "E741"]  # reality_check.py: tylko stale URL-e https do API GitHuba
