services:
  app:
    build: .
    container_name: daas_app
    env_file:
      - .env
    environment:
      DAAS_API_KEY: ${DAAS_API_KEY:?DAAS_API_KEY must be set (min. 16 characters)}
      DUCKDB_PATH: /srv/app/runtime/daas.duckdb
      REPORTS_DIR: /srv/app/runtime/reports
      FIXTURES_DIR: /srv/app/data/fixtures
    volumes:
      - ./runtime:/srv/app/runtime
    ports:
      - "127.0.0.1:8000:8000"   # tylko loopback; publiczny dostep przez reverse proxy z TLS
    networks:
      - daas_network
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.45.5
    container_name: daas_n8n
    env_file:
      - .env
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Warsaw}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD must be set}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set}
      DAAS_APP_URL: http://app:8000
      DAAS_API_KEY: ${DAAS_API_KEY:?DAAS_API_KEY must be set (min. 16 characters)}  # workflowy wysylaja go w X-API-Key
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/srv/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      - app
    networks:
      - daas_network
    restart: unless-stopped

networks:
  daas_network:
    driver: bridge

volumes:
  n8n_data:
