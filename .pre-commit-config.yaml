# Instalacja (raz na repo):  pip install pre-commit  &&  pre-commit install
# Uwaga: przy globalnym core.hooksPath (~/.ppc/githooks) "pre-commit install" odmowi instalacji;
# wtedy recznie: pre-commit run --all-files. W CI gitleaks i ruff chodza niezaleznie.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks # blokuje commit z tokenem/kluczem
        args: ["--config", ".gitleaks.toml"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2eeb5678de71a00c0902cbda7105d328432f72cb  # frozen: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-merge-conflict
      - id: check-yaml
  - repo: local
    hooks:
      - id: no-private-audit-reports
        name: block private IR/audit reports and raw collector dumps
        entry: bash -c 'git diff --cached --name-only | grep -Ei "(raport2?\.md|FazaA_audit|/raw/|uksc_[A-Z0-9-]+_[0-9]{8}_[0-9]{6}\.json)" && echo "BLOCKED: private audit artifact staged" && exit 1 || exit 0'
        language: system
        pass_filenames: false
