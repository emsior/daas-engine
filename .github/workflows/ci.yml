name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: OPSEC check
        run: |
          ! git grep -iE "mcq089[@]|bukmache[r]" -- ':!*.png' ':!*.mp4'
      - name: Tests (mock mode — no secrets)
        run: pytest -v -p no:cacheprovider
      - name: Smoke API
        run: |
          uvicorn app.main:app --port 8000 &
          sleep 4
          curl -sf localhost:8000/health
          curl -sf -X POST localhost:8000/run -H "Content-Type: application/json" -d '{"pipeline":"ecommerce_demo"}' | grep -q '"MOCK_DATA"'
          curl -sf -F "file=@data/fixtures/client_export_pl.csv" localhost:8000/upload | grep -q '"ready":true'
          curl -sf localhost:8000/reports/ecommerce_demo/latest | grep -q "<table>"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t daas-engine:ci .
      - name: Run container & smoke
        run: |
          docker run -d --rm --name daas -p 8000:8000 daas-engine:ci
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break || sleep 1; done
          curl -sf -X POST localhost:8000/run -H "Content-Type: application/json" -d '{"pipeline":"cs2_demo"}' | grep -q '"SUCCESS"'
          docker stop daas
