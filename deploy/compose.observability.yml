# Opcjonalna nakladka: obserwowalnosc (Prometheus + Alertmanager + node_exporter, Grafana na zadanie).
# Opis, sprawdzanie i luki instrumentacji: deploy/observability/README.md. Alerty i SLO: deploy/ALERTS.md, deploy/SLO.md.
#
# Wlaczenie (na hoscie, w deploy/):
#   1. Utworz pliki sekretow z szablonow *.example w deploy/observability/secrets/ (prawa i UID: README, sekcja 2).
#      Pliki MUSZA istniec przed `up`: inaczej Docker zalozy w ich miejscu puste katalogi.
#      Wyrenderuj konfiguracje Alertmanagera: observability/render-alertmanager.sh (zapisuje observability/local/alertmanager.yml).
#      Bez tego pliku `docker compose up` konczy sie bledem (create_host_path: false): alerty nie moga startowac "na slepo".
#   2. Utworz katalog textfile dla node_exportera: install -d -m 0755 /var/lib/node_exporter/textfile
#   3. W deploy/.env ustaw COMPOSE_FILE=compose.yml:compose.observability.yml
#      (z nakladka LLM: COMPOSE_FILE=compose.yml:compose.llm.yml:compose.observability.yml)
#   4. docker compose up -d                      # prometheus, alertmanager, node_exporter
#   5. docker compose --profile dash up -d grafana     # dashboard na zadanie
#      docker compose stop grafana                     # po uzyciu (oszczedza ok. 256 MB RAM)
# Wylaczenie: usun nakladke z COMPOSE_FILE i `docker compose up -d --remove-orphans`. Dane zostaja w wolumenach.
#
# Porty (WYLACZNIE 127.0.0.1, nigdy przez Caddy): Prometheus 9090, Alertmanager 9093, node_exporter 9100, Grafana 3001.
# Dostep z pulpitu operatora: ssh -L 3001:127.0.0.1:3001 <uzytkownik>@<host>, potem http://127.0.0.1:3001/ (Grafana)
# albo -L 9090:127.0.0.1:9090 (UI Prometheusa: awaryjnie wystarcza bez Grafany).
#
# Budzet pamieci (mem_limit): prometheus 320 MB + alertmanager 64 MB + node_exporter 64 MB = 448 MB stale;
# grafana 256 MB tylko w trakcie uzycia (profil `dash`) = 704 MB z Grafana. Razem z aplikacja (api 1536 + web 384 +
# caddy 128 = 2048 MB): 2496 MB stale / 2752 MB z Grafana na VPS 4 GB. Limity to sufit, zuzycie rzeczywiste jest nizsze.
#
# Obrazy sa przypiete do tagu ORAZ do digestu (`repo:tag@sha256:...`): tag zostaje dla czytelnosci i dla Dependabota
# (ekosystem docker-compose dla /deploy), digest jest tym, co faktycznie sie pobiera. Digesty zweryfikowane w rejestrach 04.11.2026.
name: daas-engine

# Kotwice YAML nie przechodza miedzy plikami compose, wiec definicja logowania jest powtorzona (jak w compose.yml).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    user: "65534:65534"
    # Brak --web.enable-lifecycle i --web.enable-admin-api (wylaczone): przeladowanie konfiguracji to
    # `docker compose kill -s SIGHUP prometheus`. Retencja 35 dni (okno SLO to 30 dni) z limitem rozmiaru
    # 2 GB (dysk 40 GB; kilkaset serii daje rzeczywiscie ok. 0,1-0,3 GB).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=35d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=0.0.0.0:9090
      - --log.format=json
    environment:
      GOMEMLIMIT: 280MiB
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - ./observability/secrets/metrics_token:/etc/prometheus/secrets/metrics_token:ro
    ports:
      - "127.0.0.1:${DAAS_PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 320m
    pids_limit: 128
    stop_grace_period: 30s
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    restart: unless-stopped
    user: "65534:65534"
    # --cluster.listen-address= (puste) wylacza klaster: jedna instancja, bez portu 9094.
    # Konfiguracja: wersja lokalna z render-alertmanager.sh (observability/local/alertmanager.yml; szablon w repo ma
    # placeholdery <<...>>). Fail-closed: brak pliku = `up` konczy sie bledem (create_host_path: false), nie startuje
    # Alertmanager, ktory nie wyslalby ani jednego e-maila. DAAS_ALERTMANAGER_CONFIG w .env zmienia sciezke zrodlowa.
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
      - --cluster.listen-address=
      - --log.format=json
    environment:
      GOMEMLIMIT: 56MiB
    volumes:
      - alertmanager_data:/alertmanager
      - type: bind
        source: ${DAAS_ALERTMANAGER_CONFIG:-./observability/local/alertmanager.yml}
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
        bind:
          create_host_path: false
      - ./observability/secrets/smtp_password:/etc/alertmanager/secrets/smtp_password:ro
      - ./observability/secrets/heartbeat_url:/etc/alertmanager/secrets/heartbeat_url:ro
    ports:
      - "127.0.0.1:${DAAS_ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    pids_limit: 64
    logging: *default-logging

  # Metryki hosta. pid: host jest potrzebne, zeby kolektor filesystem czytal /proc/1/mountinfo hosta (inaczej
  # zobaczylby tylko montowania kontenera); kontener dziala jako nobody, bez uprawnien (cap_drop ALL), z rootfs hosta
  # zamontowanym tylko do odczytu. Minimalny zestaw kolektorow: reszta (netdev, diskstats, hwmon...) wylaczona.
  node_exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    restart: unless-stopped
    user: "65534:65534"
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=0.0.0.0:9100
      - --log.format=json
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.time
      # oom_kill z /proc/vmstat: alert ApiMemoryPressure (zabicie procesu przez OOM) i panel "Host"
      - --collector.vmstat
      - --collector.vmstat.fields=^(oom_kill|pswpin|pswpout)$$
      - --collector.filesystem
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
      # pliki *.prom z crona hosta: przejsciowe L-4 (poczta) i L-8 (znacznik kopii), patrz observability/README.md
      - --collector.textfile
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
    environment:
      GOMEMLIMIT: 56MiB
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: ${DAAS_TEXTFILE_DIR:-/var/lib/node_exporter/textfile}
        target: /var/lib/node_exporter/textfile
        read_only: true
    ports:
      - "127.0.0.1:${DAAS_NODE_EXPORTER_PORT:-9100}:9100"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    pids_limit: 64
    logging: *default-logging

  # Dashboard na zadanie (profil `dash`): docker compose --profile dash up -d grafana. Bez publikacji przez Caddy,
  # dostep wylacznie tunelem SSH (naglowek pliku). Anonimowy dostep, rejestracja, telemetria i wychodzace
  # sprawdzanie aktualizacji wylaczone; haslo admina z pliku.
  grafana:
    image: grafana/grafana:12.0.2@sha256:b5b59bfc7561634c2d7b136c4543d702ebcc94a3da477f21ff26f89ffd4214fa
    profiles: ["dash"]
    restart: unless-stopped
    user: "472"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3001/
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
      GOMEMLIMIT: 220MiB
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./observability/secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
    ports:
      - "127.0.0.1:${DAAS_GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 128
    logging: *default-logging

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
